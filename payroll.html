<!DOCTYPE html>
<html lang="en">
<head>
<script src="/auth.js"></script>
<meta charset="UTF-8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="SWJ">
<meta name="theme-color" content="#1a1814">
<link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="512x512" href="/assets/icon-512.png">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>SWJ — Payroll</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

:root {
  --ink:        #1a1814;
  --ink-soft:   #3d3830;
  --cream:      #f5f2ed;
  --warm:       #faf8f5;
  --taupe:      #a29c96;
  --taupe-lt:   #d4cfc9;
  --taupe-dk:   #7a6f69;
  --gold:       #c9a96e;
  --gold-lt:    #f5ead8;
  --gold-dk:    #9d7a44;
  --green:      #4a7c50;
  --green-lt:   #edf4ed;
  --amber:      #c97c2e;
  --amber-lt:   #fdf0e0;
  --red:        #b53535;
  --red-lt:     #fef0f0;
}

body { font-family:'Inter',-apple-system,sans-serif; background:var(--cream); color:var(--ink); min-height:100vh; }

.hdr { background:var(--ink); position:sticky; top:0; z-index:60; }
.hdr-top { display:flex; align-items:center; justify-content:space-between; padding:14px 20px 10px; flex-wrap:wrap; gap:10px; }
.brand { display:flex; align-items:baseline; gap:10px; }
.brand-name { font-family:'Cormorant Garamond',serif; font-size:24px; font-weight:300; color:#fff; letter-spacing:4px; }
.brand-sep { width:1px; height:16px; background:rgba(255,255,255,0.18); }
.brand-sub { font-size:10px; color:rgba(255,255,255,0.35); letter-spacing:2.5px; text-transform:uppercase; }
.nav-sw { display:flex; gap:2px; background:rgba(255,255,255,0.07); border-radius:20px; padding:3px; flex-wrap:wrap; }
.nav-btn { padding:5px 14px; border-radius:16px; border:none; font-size:11px; font-weight:500; cursor:pointer; font-family:'Inter',sans-serif; transition:all 0.18s; }
.nav-btn.on { background:#fff; color:var(--ink); }
.nav-btn.off { background:transparent; color:rgba(255,255,255,0.4); }

.wrap { max-width:1000px; margin:0 auto; padding:20px; }
.card { background:#fff; border:0.5px solid var(--taupe-lt); border-radius:14px; padding:18px 20px; margin-bottom:18px; }
.card-hdr { font-size:11px; font-weight:600; color:var(--taupe-dk); text-transform:uppercase; letter-spacing:1.2px; margin-bottom:14px; display:flex; justify-content:space-between; align-items:center; }

/* Employees */
.emp-row { display:flex; align-items:center; justify-content:space-between; padding:9px 0; border-bottom:0.5px solid var(--warm); font-size:14px; }
.emp-row:last-child { border-bottom:none; }
.emp-name.inactive { color:var(--taupe); text-decoration:line-through; }
.emp-toggle { font-size:11px; padding:4px 10px; border-radius:14px; border:0.5px solid var(--taupe-lt); background:var(--warm); cursor:pointer; color:var(--ink-soft); }
.add-emp-row { display:flex; gap:8px; margin-top:12px; }
.add-emp-row input { flex:1; padding:9px 12px; border:0.5px solid var(--taupe-lt); border-radius:8px; font-size:13px; outline:none; }
.add-emp-row button { padding:9px 16px; border:none; border-radius:8px; background:var(--ink); color:#fff; font-size:13px; cursor:pointer; }

/* Filters */
.filter-row { display:flex; gap:10px; flex-wrap:wrap; align-items:flex-end; }
.filter-field { display:flex; flex-direction:column; gap:4px; }
.filter-field label { font-size:10px; color:var(--taupe-dk); text-transform:uppercase; letter-spacing:0.6px; }
.filter-field select, .filter-field input { padding:8px 10px; border:0.5px solid var(--taupe-lt); border-radius:8px; font-size:13px; font-family:inherit; }
.filter-btn { padding:8px 14px; border:0.5px solid var(--taupe-lt); border-radius:8px; background:var(--warm); font-size:13px; cursor:pointer; }
.filter-btn.primary { background:var(--ink); color:#fff; border:none; }

/* Totals */
.totals-row { display:flex; gap:24px; margin-top:14px; padding-top:14px; border-top:0.5px solid var(--warm); }
.total-item .lbl { font-size:10px; color:var(--taupe-dk); text-transform:uppercase; letter-spacing:0.6px; }
.total-item .val { font-family:'Cormorant Garamond',serif; font-size:22px; margin-top:2px; }

/* Table */
table { width:100%; border-collapse:collapse; font-size:13px; margin-top:10px; }
th { text-align:left; font-size:10px; color:var(--taupe-dk); text-transform:uppercase; letter-spacing:0.6px; padding:8px 6px; border-bottom:1px solid var(--taupe-lt); }
td { padding:9px 6px; border-bottom:0.5px solid var(--warm); vertical-align:top; }
tr.paid-row { opacity:0.55; }
.pill { font-size:10px; font-weight:600; padding:3px 8px; border-radius:12px; }
.pill.staging { background:var(--gold-lt); color:var(--gold-dk); }
.pill.destage { background:var(--amber-lt); color:var(--amber); }
.pill.warehouse { background:var(--green-lt); color:var(--green); }
.pill.travel { background:#edf0f6; color:#4a5e82; }
.mini-btn { font-size:11px; padding:3px 9px; border-radius:10px; border:0.5px solid var(--taupe-lt); background:var(--warm); cursor:pointer; }
.empty-note { color:var(--taupe); font-size:13px; padding:20px 0; text-align:center; }
.tbl-scroll { overflow-x:auto; }
</style>
</head>
<body>

<div class="hdr">
  <div class="hdr-top">
    <div class="brand">
      <div class="brand-name">SWJ</div>
      <div class="brand-sep"></div>
      <div class="brand-sub">Payroll</div>
    </div>
    <div class="nav-sw">
      <button class="nav-btn off" onclick="window.location.href='/today.html'">Today</button>
      <button class="nav-btn off" onclick="window.location.href='/board.html'">Board</button>
      <button class="nav-btn off" onclick="window.location.href='/shop.html'">Shop</button>
      <button class="nav-btn off" onclick="window.location.href='/index.html'">Invoice</button>
      <button class="nav-btn off" onclick="window.location.href='/luxury.html'">Luxury</button>
      <button class="nav-btn off" onclick="window.location.href='/gs-invoice.html'">GS</button>
      <button class="nav-btn on">Payroll</button>
    </div>
  </div>
</div>

<div class="wrap">

  <div class="card">
    <div class="card-hdr">Team</div>
    <div id="employees-list"></div>
    <div class="add-emp-row">
      <input type="text" id="new-emp-name" placeholder="Employee name">
      <button onclick="addEmployee()">+ Add</button>
    </div>
    <div style="font-size:10px;color:var(--taupe);margin-top:8px">Employees clock their own hours in at <strong>/hours.html</strong> — share that link with the team.</div>
  </div>

  <div class="card">
    <div class="card-hdr">Filter Entries</div>
    <div class="filter-row">
      <div class="filter-field">
        <label>Employee</label>
        <select id="f-employee"><option value="">All</option></select>
      </div>
      <div class="filter-field">
        <label>From</label>
        <input type="date" id="f-from">
      </div>
      <div class="filter-field">
        <label>To</label>
        <input type="date" id="f-to">
      </div>
      <div class="filter-field">
        <label>Status</label>
        <select id="f-status">
          <option value="">All</option>
          <option value="unpaid" selected>Unpaid only</option>
          <option value="paid">Paid only</option>
        </select>
      </div>
      <button class="filter-btn primary" onclick="loadEntries()">Apply</button>
      <button class="filter-btn" onclick="exportCsv()">⬇ Export CSV</button>
      <button class="filter-btn" onclick="markFilteredPaid()">Mark All Shown as Paid</button>
    </div>
    <div class="totals-row">
      <div class="total-item"><div class="lbl">Entries</div><div class="val" id="tot-count">0</div></div>
      <div class="total-item"><div class="lbl">Hours</div><div class="val" id="tot-hours">0</div></div>
      <div class="total-item"><div class="lbl">Total Owed</div><div class="val" id="tot-amount">$0.00</div></div>
    </div>
  </div>

  <div class="card">
    <div class="card-hdr">Time Entries</div>
    <div class="tbl-scroll">
      <table>
        <thead>
          <tr><th>Date</th><th>Employee</th><th>Type</th><th>Job</th><th>In</th><th>Out</th><th>Hrs</th><th>Rate</th><th>Amount</th><th>Status</th></tr>
        </thead>
        <tbody id="entries-body"></tbody>
      </table>
      <div class="empty-note" id="entries-empty" style="display:none">No entries match these filters.</div>
    </div>
  </div>

</div>

<script>
const _sb = supabase.createClient(
  'https://cwvdfgrjlrpsdfwduwvn.supabase.co',
  'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImN3dmRmZ3JqbHJwc2Rmd2R1d3ZuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzgwMDcyODUsImV4cCI6MjA5MzU4MzI4NX0.zam9AnIwW91TI6eCKUcg05LhvFcRa7op4QsjRpdcrCY'
);

const LABEL_BY_KEY = { staging:'Staging (On-Site)', destage:'Destage', warehouse:'Warehouse', travel:'Travel' };

let _entries = [];

function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function fmtMoney(n){return '$'+Number(n||0).toFixed(2);}
function fmtDateTime(iso){ if(!iso) return '—'; const d=new Date(iso); return d.toLocaleString('en-US',{month:'short',day:'numeric',hour:'numeric',minute:'2-digit'}); }
function fmtDate(iso){ if(!iso) return '—'; const d=new Date(iso); return d.toLocaleDateString('en-US',{month:'short',day:'numeric',year:'2-digit'}); }

async function loadEmployees(){
  const {data,error} = await _sb.from('employees').select('*').order('name');
  const list = document.getElementById('employees-list');
  const filterSel = document.getElementById('f-employee');
  if(error){ list.innerHTML = '<div class="empty-note">Could not load employees — make sure the `employees` table exists in Supabase.</div>'; return; }
  const emps = data||[];
  list.innerHTML = emps.length ? emps.map(e=>`
    <div class="emp-row">
      <span class="emp-name ${e.active?'':'inactive'}">${esc(e.name)}</span>
      <button class="emp-toggle" onclick="toggleEmployee('${e.id}',${!e.active})">${e.active?'Deactivate':'Reactivate'}</button>
    </div>
  `).join('') : '<div class="empty-note">No employees yet — add one below.</div>';

  filterSel.innerHTML = '<option value="">All</option>' + emps.map(e=>`<option value="${esc(e.name)}">${esc(e.name)}</option>`).join('');
}

async function addEmployee(){
  const input = document.getElementById('new-emp-name');
  const name = input.value.trim();
  if(!name) return;
  const {error} = await _sb.from('employees').insert({name, active:true});
  if(error){ alert('Could not add employee: '+error.message); return; }
  input.value = '';
  loadEmployees();
}

async function toggleEmployee(id, newActive){
  await _sb.from('employees').update({active:newActive}).eq('id', id);
  loadEmployees();
}

async function loadEntries(){
  const employee = document.getElementById('f-employee').value;
  const from = document.getElementById('f-from').value;
  const to = document.getElementById('f-to').value;
  const status = document.getElementById('f-status').value;

  let q = _sb.from('time_entries').select('*').order('clock_in',{ascending:false}).limit(500);
  if(employee) q = q.eq('employee_name', employee);
  if(from) q = q.gte('clock_in', from+'T00:00:00');
  if(to) q = q.lte('clock_in', to+'T23:59:59');
  if(status==='paid') q = q.eq('paid', true);
  if(status==='unpaid') q = q.eq('paid', false);

  const {data,error} = await q;
  if(error){ document.getElementById('entries-empty').textContent = 'Could not load entries — make sure the `time_entries` table exists in Supabase.'; document.getElementById('entries-empty').style.display='block'; return; }
  _entries = data||[];
  renderEntries();
}

function renderEntries(){
  const body = document.getElementById('entries-body');
  const empty = document.getElementById('entries-empty');
  if(!_entries.length){
    body.innerHTML = '';
    empty.textContent = 'No entries match these filters.';
    empty.style.display = 'block';
  } else {
    empty.style.display = 'none';
    body.innerHTML = _entries.map(e=>`
      <tr class="${e.paid?'paid-row':''}">
        <td>${fmtDate(e.clock_in)}</td>
        <td>${esc(e.employee_name)}</td>
        <td><span class="pill ${esc(e.work_type)}">${esc(LABEL_BY_KEY[e.work_type]||e.work_type)}</span></td>
        <td>${esc(e.job_label||'—')}</td>
        <td>${fmtDateTime(e.clock_in)}</td>
        <td>${e.clock_out?fmtDateTime(e.clock_out):'<em>active</em>'}</td>
        <td>${e.hours!=null?e.hours:'—'}</td>
        <td>${fmtMoney(e.rate)}</td>
        <td>${e.amount!=null?fmtMoney(e.amount):'—'}</td>
        <td>${e.paid?'✓ Paid':(e.clock_out?`<button class="mini-btn" onclick="markPaid('${e.id}')">Mark Paid</button>`:'—')}</td>
      </tr>
    `).join('');
  }

  const count = _entries.length;
  const hours = _entries.reduce((s,e)=>s+(parseFloat(e.hours)||0),0);
  const amount = _entries.reduce((s,e)=>s+(parseFloat(e.amount)||0),0);
  document.getElementById('tot-count').textContent = count;
  document.getElementById('tot-hours').textContent = Math.round(hours*100)/100;
  document.getElementById('tot-amount').textContent = fmtMoney(amount);
}

async function markPaid(id){
  await _sb.from('time_entries').update({paid:true}).eq('id', id);
  loadEntries();
}

async function markFilteredPaid(){
  const unpaidIds = _entries.filter(e=>!e.paid && e.clock_out).map(e=>e.id);
  if(!unpaidIds.length){ alert('Nothing unpaid in the current results.'); return; }
  if(!confirm(`Mark ${unpaidIds.length} entries as paid?`)) return;
  await _sb.from('time_entries').update({paid:true}).in('id', unpaidIds);
  loadEntries();
}

function exportCsv(){
  if(!_entries.length){ alert('Nothing to export — adjust your filters first.'); return; }
  const header = ['Date','Employee','Type','Job','Clock In','Clock Out','Hours','Rate','Amount','Paid'];
  const rows = _entries.map(e=>[
    fmtDate(e.clock_in), e.employee_name, LABEL_BY_KEY[e.work_type]||e.work_type, e.job_label||'',
    e.clock_in||'', e.clock_out||'', e.hours!=null?e.hours:'', e.rate, e.amount!=null?e.amount:'', e.paid?'Yes':'No'
  ]);
  const csv = [header, ...rows].map(r=>r.map(v=>`"${String(v).replace(/"/g,'""')}"`).join(',')).join('\r\n');
  const blob = new Blob([csv], {type:'text/csv'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `SWJ_Payroll_${new Date().toISOString().split('T')[0]}.csv`;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(url), 30000);
}

document.addEventListener('DOMContentLoaded', async ()=>{
  await loadEmployees();
  await loadEntries();
});
</script>
</body>
</html>
