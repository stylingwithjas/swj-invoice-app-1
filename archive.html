<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

:root {
  --ink:        #1a1814;

  --cream:      #f5f2ed;
  --warm:       #faf8f5;
  --taupe:      #a29c96;

  --gold-dk:    #9d7a44;
  --green:      #4a7c50;

  --amber:      #c97c2e;
  --amber-lt:   #fdf0e0;
  --red:        #b53535;
  --red-lt:     #fef0f0;
}

body { font-family:'Inter',-apple-system,sans-serif; background:var(--cream); color:var(--ink); min-height:100vh; }

.hdr { background:var(--ink); position:sticky; top:0; z-index:60; }
.hdr-top { display:flex; align-items:center; justify-content:space-between; padding:14px 20px 10px; flex-wrap:wrap; gap:10px; }
.brand { display:flex; align-items:baseline; gap:10px; }
.brand-name { font-family:'Cormorant Garamond',serif; font-size:24px; font-weight:300; color:#fff; letter-spacing:4px; }

.brand-sub { font-size:10px; color:rgba(255,255,255,0.35); letter-spacing:2.5px; text-transform:uppercase; }
.nav-sw { display:flex; gap:2px; background:rgba(255,255,255,0.07); border-radius:20px; padding:3px; flex-wrap:wrap; }
.nav-btn { padding:5px 14px; border-radius:16px; border:none; font-size:11px; font-weight:500; cursor:pointer; font-family:'Inter',sans-serif; transition:all 0.18s; }
.nav-btn.on { background:#fff; color:var(--ink); }
.nav-btn.off { background:transparent; color:rgba(255,255,255,0.4); }
@media (max-width: 1199px) { .nav-sw { max-width:100%; overflow-x:auto; scrollbar-width:none; -webkit-overflow-scrolling:touch; } .nav-sw::-webkit-scrollbar { display:none; } .nav-btn { flex-shrink:0; } }

.wrap { max-width:900px; margin:0 auto; padding:20px; }

.tabs { display:flex; gap:2px; background:var(--warm); border-radius:12px; padding:3px; margin-bottom:16px; }

.summary-note { font-size:11px; color:var(--taupe-dk); margin-bottom:12px; }

.arc-card { background:#fff; border:0.5px solid var(--taupe-lt); border-radius:12px; padding:14px 16px; margin-bottom:10px; }
.arc-top { display:flex; justify-content:space-between; align-items:flex-start; gap:10px; }
.arc-name { font-family:'Cormorant Garamond',serif; font-size:19px; }
.arc-addr { font-size:12px; color:var(--taupe-dk); margin-top:2px; }

.arc-badge.signed { background:var(--green-lt); color:var(--green); }
.arc-badge.stage { background:var(--gold-lt); color:var(--gold-dk); }
.arc-actions { display:flex; gap:8px; margin-top:10px; flex-wrap:wrap; }
.arc-actions a, .arc-actions button { font-size:11px; font-weight:600; padding:6px 12px; border-radius:8px; text-decoration:none; cursor:pointer; font-family:inherit; border:0.5px solid var(--taupe-lt); background:var(--warm); color:var(--ink-soft); }

/* ── SWJ SIDEBAR + BOTTOM NAV (responsive nav shell, shared across pages) ──
   Desktop >=1200px: persistent left sidebar, existing top nav-sw hidden.
   Mobile <768px: fixed bottom nav + More sheet, existing top nav-sw hidden.
   Tablet 768-1199px: the existing top nav-sw (already horizontal-scroll-safe)

  .swj-sidebar{ display:flex; flex-direction:column; position:fixed; top:0; left:0; bottom:0; width:220px; background:var(--swj-nav-bg); z-index:100; padding:22px 0 16px; }

<script>
const _sb = supabase.createClient(
  'https://cwvdfgrjlrpsdfwduwvn.supabase.co',
  'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImN3dmRmZ3JqbHJwc2Rmd2R1d3ZuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzgwMDcyODUsImV4cCI6MjA5MzU4MzI4NX0.zam9AnIwW91TI6eCKUcg05LhvFcRa7op4QsjRpdcrCY'
);

const STAGE_LABEL = { proposal:'Proposal', future_hold:'Future Hold', confirmed:'Confirmed', staged:'Staged', destage:'Destage', done:'Done', denied:'Declined', closed_lost:'Closed — Lost' };

let _allInvoices = [];
let _activeTab = 'signed';
const STRIPE_FEE_PCT = 0.029, STRIPE_FEE_FLAT = 0.30;

function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function fmtMoney(n){ return '$' + Math.round(n||0).toLocaleString(); }
function fmtDate(iso){ if(!iso) return ''; if(iso==='TBD') return 'TBD'; const d=new Date(iso+'T00:00:00'); return d.toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'}); }

function computeGrand(d){
  const _ov=v=>(v!=null&&v!=='')?parseFloat(v):null;
  const tot=_ov(d.total_override); if(tot!=null) return tot;
  const base = parseFloat(d.base_price) || 2500;
  const addonsTotal = (d.addons||[]).reduce((s,a)=>s+(parseFloat(a.price)||0),0);
  const taxrate = parseFloat(d.taxrate) || 0;
  const sub=_ov(d.subtotal_override); const subEff=sub!=null?sub:(base+addonsTotal);
  const tax=_ov(d.tax_override); const taxEff=tax!=null?tax:subEff*taxrate/100;
  return subEff+taxEff;
}

// No row cap (unlike the board's active-pipeline Kanban, which only fetches the 200 most
// recently created invoices) — this is meant to be the permanent, searchable record of
// every invoice ever created, including ones that fell off the board entirely.
// Old contract_url links can be expired signed-URL tokens (they used to only last 30 days —
// see CONTRACT_LINK_TTL in api/sign.py), so always ask for a fresh one instead of trusting
// whatever's stored. Opens the blank tab BEFORE the await so iOS Safari's popup blocker
// doesn't treat this as a non-user-initiated navigation.
async function downloadSignedContract(invnum, btn){
  let win = null;
  try{ win = window.open('', '_blank'); }catch(e){}
  const orig = btn.textContent;
  btn.textContent = 'Preparing…'; btn.disabled = true;
  try{
    const r = await fetch('/api/sign', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({action:'refresh_link', invnum})});
    const j = await r.json();
    if(!j.contract_url) throw new Error(j.error || 'No link returned');
    if(win) win.location.href = j.contract_url;
    else window.open(j.contract_url, '_blank');
  }catch(e){
    if(win) win.close();
    alert('Could not open the contract: '+e.message);
  }finally{
    btn.textContent = orig; btn.disabled = false;
  }
}

async function loadAll(){
  try{
    const {data,error} = await _sb.from('invoices').select('invnum,client,address,invdate,created_at,data')
      .not('invnum','like','DRAFT-%').not('invnum','like','GS%').neq('invnum','PRICING_DEFAULTS').neq('invnum','TIER_PRICING').not('invnum','like','TAX_REVIEW_%').neq('invnum','FINANCE_CONFIG').neq('invnum','FINANCE_OVERRIDES')
      .order('created_at',{ascending:false}).limit(1000);
    if(error) throw error;
    _allInvoices = data||[];
  }catch(e){
    document.getElementById('list-body').innerHTML = `<div class="empty-note">Could not load the archive: ${esc(e.message)}</div>`;
    document.getElementById('summary-note').textContent = '';
    return;
  }
  renderList();
}

function switchTab(tab){
  _activeTab = tab;
  document.getElementById('tab-signed').classList.toggle('on', tab==='signed');
  document.getElementById('tab-quoted').classList.toggle('on', tab==='quoted');
  document.getElementById('tab-cleanup').classList.toggle('on', tab==='cleanup');
  document.getElementById('search-input').closest('.search-row').style.display = tab==='cleanup' ? 'none' : '';
  document.getElementById('payer-filter-row').style.display = tab==='cleanup' ? 'none' : '';
  document.getElementById('raw-lookup-row').style.display = tab==='cleanup' ? 'block' : 'none';
  if(tab==='cleanup') loadCleanupCandidates();
  else renderList();
}

// --- Cleanup Review: a read-only dry-run report surfacing likely test/duplicate/abandoned
// records for Gabe/Jasmine to look over. It NEVER deletes anything — it only lists candidates
// with the reason each was flagged, so a human decides what (if anything) gets removed.
let _cleanupLoaded = false;
let _cleanupAll = [];

async function loadCleanupCandidates(){
  const body = document.getElementById('list-body');
  const note = document.getElementById('summary-note');
  if(_cleanupLoaded){ renderCleanupReport(); return; }
  note.textContent = 'Loading…';
  body.innerHTML = '';
  try{
    // Unlike the normal archive tabs, this pulls EVERY row with no exclusions at all —
    // test/duplicate/system records are exactly what we're hunting for here.
    const {data,error} = await _sb.from('invoices').select('invnum,client,address,invdate,created_at,data')
      .order('created_at',{ascending:false}).limit(2000);
    if(error) throw error;
    _cleanupAll = data||[];
    _cleanupLoaded = true;
  }catch(e){
    body.innerHTML = `<div class="empty-note">Could not load cleanup candidates: ${esc(e.message)}</div>`;
    note.textContent = '';
    return;
  }
  renderCleanupReport();
}

function renderCleanupReport(){
  const body = document.getElementById('list-body');
  const note = document.getElementById('summary-note');
  const rows = _cleanupAll;

  // 1) Versioned/duplicate-looking invnums (e.g. "2020130-v2", "2020130copy", "2020130(v2)").
  // No separator is required before the marker — the real naming convention for these
  // wasn't available to confirm against (no direct DB access from this environment), so
  // this errs toward catching more rather than requiring an exact, unverified format.
  const versionFlagged = rows.filter(inv => /\(?(copy|dup(?:licate)?|test|v\d{1,2})\)?\s*$/i.test(String(inv.invnum||'')));

  // 2) Exact client+address+invdate duplicates (same job entered more than once).
  const groups = {};
  rows.forEach(inv=>{
    const d = inv.data||{};
    const client = (inv.client||d.client||'').trim().toLowerCase();
    const address = (inv.address||d.address||'').trim().toLowerCase();
    if(!client && !address) return;
    const key = client+'|'+address+'|'+(inv.invdate||'');
    (groups[key]=groups[key]||[]).push(inv);
  });
  const dupGroups = Object.values(groups).filter(g=>g.length>1);

  // 3) Signed contracts totaling $1 or less (known test-signature pattern). Keyed off
  // signed + total only — a test record often has no real contract_url, so requiring one
  // (as an earlier version of this check did) silently excluded exactly the rows this is
  // supposed to find.
  const dollarOne = rows.filter(inv=>{
    const d = inv.data||{};
    // <= 1.01, not <= 1 — a strict $1 boundary can miss a real $1 test record by a fraction
    // of a cent from floating-point rounding in computeGrand() (audit finding: this kept
    // reading 0 against a known $1 signed record even after the contract_url requirement
    // was dropped).
    return !!d.signed && computeGrand(d) <= 1.01;
  });

  // 4) Never emailed to a client at all (no send_log, not signed, not a draft/system row) —
  // informational only: send_log is new, so older legitimate invoices will also show up here.
  const SYSTEM = ['PRICING_DEFAULTS','TIER_PRICING','FINANCE_CONFIG','FINANCE_OVERRIDES'];
  const isSystemRow = invnum => SYSTEM.includes(invnum) || String(invnum||'').startsWith('TAX_REVIEW_');
  const neverSent = rows.filter(inv=>{
    const d = inv.data||{};
    if(isSystemRow(inv.invnum)) return false;
    if(String(inv.invnum||'').startsWith('DRAFT-')) return false;
    if(d.signed) return false;
    return !(d.send_log && d.send_log.length);
  });

  // 5) Phase 5.1 backfill: real (non-draft/system) invoices with no structured city/ZIP
  // fields and an address this app can't confidently parse a city out of either — these
  // predate the structured address fields added with the price-led tax rebuild. Nothing is
  // guessed or auto-filled here; Gabe/Jasmine need to add the real city/ZIP by hand.
  const missingLocation = rows.filter(inv=>{
    const d = inv.data||{};
    if(isSystemRow(inv.invnum) || String(inv.invnum||'').startsWith('DRAFT-')) return false;
    if(d.zip) return false;
    const addr = inv.address || d.address || '';
    const zipMatch = addr.match(/\b\d{5}\b/);
    return !zipMatch;
  });

  // 6) Paid via "Other/Manual" — confirm if actually processed via Stripe/card (fix spec
  // addendum, Nov 1 2026: "all SWJ client payments process through Stripe" per Gabe, but each
  // correction gets confirmed individually, never silently rewritten in bulk). Flags a specific
  // payment/extension entry, not the whole invoice — one job can have several payment events.
  const otherMethodFlagged = [];
  rows.forEach(inv=>{
    if(isSystemRow(inv.invnum) || String(inv.invnum||'').startsWith('DRAFT-') || String(inv.invnum||'').startsWith('GS')) return;
    const d = inv.data||{};
    // Fix spec Batch A #6 (Nov 2, 2026): a Stripe test-mode charge is tagged is_test at the
    // source and excluded here too — it's not a real payment needing a method correction.
    (d.payments||[]).forEach((p,idx)=>{
      if(p.status==='paid' && p.paid_date && !p.payment_id && p.manual_method!=='stripe' && !p.is_test){
        otherMethodFlagged.push({ inv, kind:'payment', idx, amount:parseFloat(p.amount)||0, date:p.paid_date, approved: inv.invnum==='2020128' });
      }
    });
    (d.extensions||[]).forEach((ext,idx)=>{
      if(ext.paid && ext.paid_date && !ext.payment_id && ext.manual_method!=='stripe' && !ext.is_test){
        otherMethodFlagged.push({ inv, kind:'extension', idx, amount:parseFloat(ext.amount)||0, date:ext.paid_date, approved:false });
      }
    });
    // Legacy single-payment shape — no payments[] array at all, just top-level paid/paid_date/
    // stripe_payment_id. Confirmed live Nov 2026 as the COMMON case for an ordinary one-time
    // payment (this is how Baker #2020128 is actually stored, not payments[]) — the original
    // version of this section only checked payments[] and missed every invoice shaped this way.
    if(!(d.payments||[]).length && d.paid && d.paid_date && !d.stripe_payment_id && d.manual_method!=='stripe' && !d.is_test){
      const amount = parseFloat(d.amount_paid ?? d.stripe_amount ?? computeGrand(d)) || 0;
      otherMethodFlagged.push({ inv, kind:'legacy', idx:-1, amount, date:d.paid_date, approved: inv.invnum==='2020128' });
    }
  });
  otherMethodFlagged.sort((a,b)=> (b.approved-a.approved) || (b.date||'').localeCompare(a.date||''));

  note.textContent = `${versionFlagged.length} versioned/duplicate-named, ${dupGroups.length} duplicate group(s), ${dollarOne.length} $1-or-less signed, ${neverSent.length} never emailed, ${missingLocation.length} missing city/ZIP, ${otherMethodFlagged.length} paid via Other/Manual — nothing deleted or changed`;

  const rowHtml = (inv, reason)=>{
    const d = inv.data||{};
    const client = inv.client || d.client || 'Client';
    return `<div class="arc-card">
      <div class="arc-top">
        <div><div class="arc-name">${esc(client)}</div><div class="arc-addr">${esc(inv.address||d.address||'')}</div></div>
        <div class="arc-amt">${fmtMoney(computeGrand(d))}</div>
      </div>
      <div class="arc-meta"><span>#${esc(inv.invnum)}</span><span>${esc(inv.invdate||'')}</span><span>${esc(reason)}</span></div>
      <div class="arc-actions"><a href="/proposal.html?inv=${encodeURIComponent(inv.invnum)}" target="_blank">View Details</a></div>
    </div>`;
  };

  const section = (title, html)=> html ? `<h3 style="margin:20px 0 8px;font-size:14px;color:var(--taupe-dk)">${esc(title)}</h3>${html}` : '';

  const confirmRowHtml = (item)=>{
    const d = item.inv.data||{};
    const client = item.inv.client || d.client || 'Client';
    const estFee = item.amount*STRIPE_FEE_PCT + STRIPE_FEE_FLAT;
    return `<div class="arc-card"${item.approved?' style="border-color:var(--gold);background:var(--gold-lt)"':''}>
      <div class="arc-top">
        <div><div class="arc-name">${esc(client)}${item.approved?' <span style="font-size:10px;color:var(--gold-dk);font-weight:700">· APPROVED BY GABE, NOV 1 2026</span>':''}</div><div class="arc-addr">${esc(item.inv.address||d.address||'')}</div></div>
        <div class="arc-amt">$${item.amount.toFixed(2)}</div>
      </div>
      <div class="arc-meta"><span>#${esc(item.inv.invnum)}</span><span>${esc(fmtDate(item.date))}</span><span>${item.kind==='extension'?'extension payment':'payment'} — currently "Other/Manual"</span></div>
      <div class="arc-actions">
        <a href="/proposal.html?inv=${encodeURIComponent(item.inv.invnum)}" target="_blank">View Details</a>
        <button class="primary" onclick="confirmStripeMethod('${esc(item.inv.invnum)}','${item.kind}',${item.idx},this)">Confirm paid via Stripe/card (+${'$'+estFee.toFixed(2)} fee)</button>
      </div>
    </div>`;
  };

  body.innerHTML = `
    <div class="empty-note" style="margin-bottom:12px;">This is a dry-run review only — nothing here has been deleted. Each section below lists candidates with the reason they were flagged. Have Gabe/Jasmine confirm before anything is removed. Deleting a confirmed record is intentionally only possible from its card in the board drawer (Remove from Board / Delete) — Archive has no delete path by design, so nothing can be removed from here by accident.</div>
    ${section(`Versioned or duplicate-named (${versionFlagged.length})`, versionFlagged.map(inv=>rowHtml(inv,'invoice # looks like a duplicate/version/test')).join(''))}
    ${section(`Same client+address+date entered more than once (${dupGroups.length} group${dupGroups.length===1?'':'s'})`, dupGroups.map(g=>g.map(inv=>rowHtml(inv,'duplicate of '+g.length+' matching rows')).join('')).join(''))}
    ${section(`Signed contracts totaling $1 or less (${dollarOne.length})`, dollarOne.map(inv=>rowHtml(inv,'signed, total ≤ $1 — likely a test signature')).join(''))}
    ${section(`Never emailed to a client (${neverSent.length})`, neverSent.map(inv=>rowHtml(inv,'no send_log entry on record')).join(''))}
    ${section(`Missing structured city/ZIP — needs manual backfill (${missingLocation.length})`, missingLocation.map(inv=>rowHtml(inv,'no ZIP found in address — add city/ZIP by hand')).join(''))}
    ${section(`Paid via "Other/Manual" — confirm if actually Stripe/card (${otherMethodFlagged.length})`, otherMethodFlagged.map(confirmRowHtml).join(''))}
  ` || `<div class="empty-note">No cleanup candidates found.</div>`;
}

// Applies manual_method:'stripe' to ONE specific payment or extension entry, never in bulk —
// each correction is its own explicit click (fix spec addendum, Nov 1 2026). Never fabricates
// a Stripe payment_id; this is an honest "confirmed after the fact, no webhook id captured"
// flag that the fee/report logic treats the same as a real payment_id.
async function confirmStripeMethod(invnum, kind, idx, btn){
  const inv = _cleanupAll.find(i=>i.invnum===invnum);
  if(!inv) return;
  const d = inv.data||{};
  // 'legacy' = the top-level paid/paid_date/stripe_payment_id shape (no payments[] array) —
  // confirmed live Nov 2026 as the common case for an ordinary one-time payment.
  const entry = kind==='legacy' ? d : (kind==='extension' ? (d.extensions||[])[idx] : (d.payments||[])[idx]);
  if(!entry){ alert('Could not find that payment entry — try reloading the Cleanup Review tab.'); return; }
  const amount = kind==='legacy' ? (parseFloat(d.amount_paid ?? d.stripe_amount ?? computeGrand(d))||0) : (parseFloat(entry.amount)||0);
  const paidDate = kind==='legacy' ? d.paid_date : entry.paid_date;
  const estFee = amount*STRIPE_FEE_PCT + STRIPE_FEE_FLAT;
  const ok = await customConfirm(
    `Mark ${esc(inv.client||d.client||'this client')} #${esc(invnum)}'s ${fmtDate(paidDate)} payment of $${amount.toFixed(2)} as Stripe/Card? `
    + `This adds an estimated $${estFee.toFixed(2)} processing fee to the Payroll Finance and Tax Report views. `
    + `No invoice total, tax amount, or DOR filing figure changes — this only corrects the payment method.`,
    { confirmLabel:'Confirm Stripe/Card' }
  );
  if(!ok) return;
  const orig = btn.textContent;
  btn.textContent = 'Saving…'; btn.disabled = true;
  try{
    entry.manual_method = 'stripe';
    const { error } = await _sb.from('invoices').upsert({
      invnum: inv.invnum, client: inv.client, address: inv.address, invdate: inv.invdate, data: d,
    }, { onConflict:'invnum' });
    if(error) throw error;
    renderCleanupReport();
  }catch(e){
    alert('Could not save: '+e.message);
    btn.textContent = orig; btn.disabled = false;
  }
}

// Read-only raw-data lookup — for diagnosing exactly why a specific invoice isn't showing up
// where expected (e.g. a Tax Report period miss), without needing direct Supabase console
// access. Fetches fresh from the DB (not the cached cleanup list), never writes anything.
let _rawLookupCurrent = null;

async function lookupRawData(){
  const invnum = document.getElementById('raw-lookup-invnum').value.trim();
  const out = document.getElementById('raw-lookup-result');
  if(!invnum){ out.style.display='none'; _rawLookupCurrent=null; return; }
  out.style.display = 'block';
  out.textContent = 'Looking up #'+invnum+'…';
  try{
    const { data, error } = await _sb.from('invoices').select('invnum,client,address,invdate,created_at,data').eq('invnum', invnum).maybeSingle();
    if(error) throw error;
    if(!data){ out.textContent = `No invoice found with #${invnum}.`; _rawLookupCurrent=null; return; }
    _rawLookupCurrent = { invnum: data.invnum, client: data.client, address: data.address, invdate: data.invdate, data: data.data||{} };
    renderRawLookup();
  }catch(e){
    out.textContent = 'Lookup failed: '+e.message;
    _rawLookupCurrent = null;
  }
}

// Renders the looked-up invoice's payment/extension facts, plus — this is the actionable
// part — a confirm-gated correction control per gap found: "Mark Paid" on an existing
// unpaid extension entry, or "Add & Mark Paid" when no extension entry exists at all (the
// Deji #2020107v1 case live Nov 1 2026: the real payment existed but no record of it did).
// Every action requires the person to enter/confirm the date themselves and confirm in a
// dialog — nothing here is inferred or auto-applied, same rule as confirmStripeMethod().
function renderRawLookup(){
  const cur = _rawLookupCurrent;
  const out = document.getElementById('raw-lookup-result');
  if(!cur) return;
  const d = cur.data;

  const summaryLines = [];
  summaryLines.push(`#${cur.invnum} — ${cur.client||d.client||'Client'}`);
  summaryLines.push(`signed: ${!!d.signed}${d.signed_date?' (signed_date: '+d.signed_date+')':''}`);
  summaryLines.push(`paid (legacy, top-level): ${!!d.paid}  paid_date: ${d.paid_date||'(none)'}  stripe_payment_id: ${d.stripe_payment_id||'(none)'}  manual_method: ${d.manual_method||'(none)'}`);
  summaryLines.push(`amount_paid: ${d.amount_paid!=null?d.amount_paid:'(none)'}  stripe_amount: ${d.stripe_amount!=null?d.stripe_amount:'(none)'}`);
  summaryLines.push('');
  summaryLines.push(`payments[] (${(d.payments||[]).length} entries):`);
  (d.payments||[]).forEach((p,i)=>summaryLines.push(`  [${i}] status=${p.status} amount=${p.amount} paid_date=${p.paid_date||'(none)'} payment_id=${p.payment_id||'(none)'} manual_method=${p.manual_method||'(none)'}`));

  const extensions = d.extensions||[];
  const inputStyle = 'padding:7px 9px;border:0.5px solid var(--taupe-lt);border-radius:7px;font-size:12px;font-family:inherit';
  const btnStyle = 'padding:7px 14px;border-radius:7px;border:none;background:var(--ink);color:#fff;font-size:12px;cursor:pointer;font-family:inherit';
  let extHtml = `<div style="margin-top:10px;font-weight:600">extensions[] (${extensions.length} entries):</div>`;
  if(!extensions.length){
    extHtml += `
      <div style="margin-top:6px;padding:10px;background:#fff;border:0.5px solid var(--taupe-lt);border-radius:8px">
        <div style="font-size:11.5px;color:var(--taupe-dk);margin-bottom:8px">No extension entries on this invoice. If a real extension payment exists outside this record (already verified via Stripe/bank), add it here — this creates a new entry only, nothing else on the invoice changes.</div>
        <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center">
          <input type="number" id="newext-days" placeholder="days" style="${inputStyle};width:70px">
          <input type="number" id="newext-amount" placeholder="amount" step="0.01" style="${inputStyle};width:100px">
          <input type="date" id="newext-paiddate" style="${inputStyle}">
          <label style="font-size:11.5px;display:flex;align-items:center;gap:4px"><input type="checkbox" id="newext-stripe" checked> paid via Stripe/card</label>
          <button style="${btnStyle}" onclick="addMissingExtension()">Add &amp; Mark Paid</button>
        </div>
      </div>`;
  } else {
    extHtml += extensions.map((ext,i)=>{
      const paidNow = !!ext.paid;
      const methodNote = ext.payment_id ? ' (Stripe id on file)' : (ext.manual_method==='stripe' ? ' (confirmed Stripe/card)' : ' (Other/Manual)');
      return `<div style="margin-top:6px;padding:10px;background:#fff;border:0.5px solid var(--taupe-lt);border-radius:8px">
        <div style="font-size:12px">[${i}] ${esc(ext.invnum||'(no sub-id)')} — ${esc(String(ext.days||'?'))} days, $${(parseFloat(ext.amount)||0).toFixed(2)}, created ${esc(ext.created||'(none)')}${ext.payment_url?' · has a Stripe payment link':''}</div>
        ${paidNow
          ? `<div style="font-size:11.5px;color:var(--green);margin-top:4px">✓ Paid ${esc(ext.paid_date||'')}${methodNote}</div>`
          : `<div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:8px">
              <label style="font-size:10.5px;color:var(--taupe-dk);display:flex;flex-direction:column;gap:2px">Amount actually paid
                <input type="number" step="0.01" id="ext-amount-${i}" value="${(parseFloat(ext.amount)||0).toFixed(2)}" style="${inputStyle};width:100px">
              </label>
              <label style="font-size:10.5px;color:var(--taupe-dk);display:flex;flex-direction:column;gap:2px">Date paid
                <input type="date" id="ext-paiddate-${i}" value="${esc(ext.paid_date||'')}" style="${inputStyle}">
              </label>
              <label style="font-size:11.5px;display:flex;align-items:center;gap:4px"><input type="checkbox" id="ext-stripe-${i}" checked> paid via Stripe/card</label>
              <button style="${btnStyle}" onclick="markExtensionPaid(${i})">Mark Paid</button>
            </div>`
        }
      </div>`;
    }).join('');
  }

  out.innerHTML = `<div style="white-space:pre-wrap">${esc(summaryLines.join('\n'))}</div>${extHtml}
    <details style="margin-top:10px"><summary style="cursor:pointer;font-size:11.5px;color:var(--taupe-dk)">Full raw data (JSON)</summary><pre style="white-space:pre-wrap;word-break:break-word;font-size:11px;margin-top:6px">${esc(JSON.stringify(d,null,2))}</pre></details>`;
}

async function markExtensionPaid(idx){
  const cur = _rawLookupCurrent;
  if(!cur) return;
  const ext = (cur.data.extensions||[])[idx];
  if(!ext) return;
  const paidDate = document.getElementById(`ext-paiddate-${idx}`).value;
  const viaStripe = document.getElementById(`ext-stripe-${idx}`).checked;
  const enteredAmount = parseFloat(document.getElementById(`ext-amount-${idx}`).value);
  if(!paidDate){ alert('Enter the date this extension was actually paid before marking it.'); return; }
  if(!enteredAmount || enteredAmount<=0){ alert('Enter the amount actually paid before marking it.'); return; }
  const storedAmount = parseFloat(ext.amount)||0;
  // The entry's stored amount can be wrong (e.g. billed $1,237.86, client actually paid
  // $1,280.54) — Mark Paid records what was ACTUALLY paid, never silently restates the
  // entry's original amount, and says so explicitly when the two differ (fix spec note,
  // Nov 1 2026: "Do not silently restate the entry amount as the paid amount").
  const amountChanged = Math.abs(enteredAmount - storedAmount) > 0.009;
  const ok = await customConfirm(
    `Mark ${esc(cur.client||cur.data.client||'this client')} #${esc(cur.invnum)}'s extension [${idx}] as paid on ${paidDate}, amount $${enteredAmount.toFixed(2)}`
    + (amountChanged ? ` — this entry currently says $${storedAmount.toFixed(2)}; confirming this correction will update it to $${enteredAmount.toFixed(2)} to match what was actually paid.` : '.')
    + ` This is a correction for a payment already verified outside the app (Stripe/bank) — it makes this extension count in the Tax Report for that period at the amount entered above. No other invoice field changes.`,
    { confirmLabel:'Mark Paid' }
  );
  if(!ok) return;
  // Prefer the atomic mark_extension_paid() DB function (sql/mark_extension_paid.sql, live
  // in production as of Nov 1 2026) — a single read+change+write step the database
  // guarantees can't be interleaved with another save to the same invoice, closing the
  // race that dropped Hill's EXT1/EXT2 flags in the first place. Falls back to the old
  // whole-row upsert only if the RPC call itself fails for some reason.
  try{
    const { error } = await _sb.rpc('mark_extension_paid', {
      p_invnum: cur.invnum, p_ext_invnum: ext.invnum, p_paid_date: paidDate,
      p_amount: enteredAmount, ...(viaStripe ? { p_manual_method:'stripe' } : {}),
    });
    if(error) throw error;
    ext.paid = true; ext.paid_date = paidDate; ext.amount = enteredAmount;
    if(viaStripe) ext.manual_method = 'stripe';
    renderRawLookup();
    alert('Saved (atomic DB update). Re-run the Tax Report for that period on tax-report.html to see it reflected.');
    return;
  }catch(e){
    console.warn('mark_extension_paid RPC failed, falling back to whole-row upsert:', e.message);
  }
  ext.paid = true;
  ext.paid_date = paidDate;
  ext.amount = enteredAmount;
  if(viaStripe) ext.manual_method = 'stripe';
  try{
    const { error } = await _sb.from('invoices').upsert({
      invnum: cur.invnum, client: cur.client, address: cur.address, invdate: cur.invdate, data: cur.data,
    }, { onConflict:'invnum' });
    if(error) throw error;
    renderRawLookup();
    alert('Saved. Re-run the Tax Report for that period on tax-report.html to see it reflected.');
  }catch(e){ alert('Could not save: '+e.message); }
}

async function addMissingExtension(){
  const cur = _rawLookupCurrent;
  if(!cur) return;
  const days = document.getElementById('newext-days').value;
  const amount = parseFloat(document.getElementById('newext-amount').value);
  const paidDate = document.getElementById('newext-paiddate').value;
  const viaStripe = document.getElementById('newext-stripe').checked;
  if(!paidDate || !amount){ alert('Enter at least the amount and the date it was paid before adding this record.'); return; }
  const ok = await customConfirm(
    `Add a NEW extension payment record to ${esc(cur.client||cur.data.client||'this client')} #${esc(cur.invnum)}: $${amount.toFixed(2)}, ${days||'?'} days, paid ${paidDate}? `
    + `This is a correction for a payment already verified outside the app — nothing else on this invoice changes.`,
    { confirmLabel:'Add & Mark Paid' }
  );
  if(!ok) return;
  const extensions = cur.data.extensions || [];
  const newEntry = {
    invnum: `${cur.invnum}-EXT${extensions.length+1}`, days: parseInt(days)||0, amount, type:'extension',
    paid: true, paid_date: paidDate, created: new Date().toISOString().split('T')[0],
  };
  if(viaStripe) newEntry.manual_method = 'stripe';
  extensions.push(newEntry);
  cur.data.extensions = extensions;
  try{
    const { error } = await _sb.from('invoices').upsert({
      invnum: cur.invnum, client: cur.client, address: cur.address, invdate: cur.invdate, data: cur.data,
    }, { onConflict:'invnum' });
    if(error) throw error;
    renderRawLookup();
    alert('Saved. Re-run the Tax Report for that period on tax-report.html to see it reflected.');
  }catch(e){ alert('Could not save: '+e.message); }
}

function renderList(){

  let rows = _allInvoices.filter(inv=>{

    const payerBadge = d.payer_unknown ? `<span class="arc-badge stage" style="background:#fdf0dd;color:#9d7a44">⚠ Needs a payer</span>` : '';

          ${isSigned && d.signed_by?`<span>Signed by ${esc(d.signed_by)}${d.signed_date?' on '+esc(d.signed_date):''}</span>`:''}
        </div>
        <div class="arc-actions">
          <a href="/proposal.html?inv=${encodeURIComponent(inv.invnum)}" target="_blank">View Details</a>
          ${isSigned?`<button class="primary" onclick="downloadSignedContract('${esc(inv.invnum)}', this)">Download Signed PDF</button>`:''}

        </div>

    `;
  }).join('');

// In-app confirmation (Promise<boolean>) in place of the native confirm() — unreliable
// inside an installed PWA on iOS (can silently act as Cancel, with no error shown).
function customConfirm(message, { confirmLabel = 'Confirm', cancelLabel = 'Cancel' } = {}){
  return new Promise(resolve=>{
    const ov = document.createElement('div');
    ov.style.cssText = 'position:fixed;inset:0;background:rgba(26,24,20,0.55);z-index:99999;display:flex;align-items:center;justify-content:center;padding:24px;font-family:Inter,-apple-system,sans-serif';
    const safeMsg = String(message||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\n/g,'<br>');
    ov.innerHTML = '<div style="background:#fff;border-radius:16px;max-width:360px;width:100%;padding:22px">'
      + '<div style="font-size:14px;color:#3d3830;line-height:1.5;margin-bottom:18px">' + safeMsg + '</div>'
      + '<div style="display:flex;gap:8px">'
      + '<button id="cc-cancel" style="flex:1;padding:12px;border-radius:9px;border:1px solid #d4cfc9;background:#faf8f5;font-weight:600;font-size:13px;cursor:pointer;font-family:inherit">' + cancelLabel + '</button>'
      + '<button id="cc-ok" style="flex:1;padding:12px;border-radius:9px;border:none;color:#fff;font-weight:600;font-size:13px;cursor:pointer;font-family:inherit;background:#1a1814">' + confirmLabel + '</button>'
      + '</div></div>';
    document.body.appendChild(ov);
    const cleanup = (result)=>{ ov.remove(); resolve(result); };
    ov.querySelector('#cc-cancel').onclick = ()=>cleanup(false);
    ov.querySelector('#cc-ok').onclick = ()=>cleanup(true);
    ov.addEventListener('click', e=>{ if(e.target===ov) cleanup(false); });
  });
}

// Reactivates a closed-lost quote back onto the active board (Phase 1.1 — real quotes are
// never deleted, so a late client response just needs a way back in). Resets date_sent to
// now so the 30-day silence clock starts fresh rather than immediately re-expiring it.
async function reactivateQuote(invnum, btn){
  const ok = await customConfirm('Reactivate this quote back to the board as "Quoted"?', { confirmLabel: 'Reactivate' });
  if(!ok) return;
  const orig = btn.textContent;
  btn.textContent = 'Reactivating…'; btn.disabled = true;
  try{
    const inv = _allInvoices.find(i => i.invnum === invnum);
    if(!inv) throw new Error('Not found');
    const d = { ...(inv.data||{}), stage:'proposal', date_sent: new Date().toISOString() };
    const { error } = await _sb.from('invoices').upsert({
      invnum: inv.invnum, client: inv.client, address: inv.address, invdate: inv.invdate, data: d,
    }, { onConflict:'invnum' });
    if(error) throw error;
    inv.data = d;
    renderList();
  }catch(e){
    alert('Could not reactivate: '+e.message);
    btn.textContent = orig; btn.disabled = false;
  }
}

document.addEventListener('DOMContentLoaded', loadAll);
</script>
<script>document.addEventListener('DOMContentLoaded',()=>{try{document.querySelector('.nav-sw .nav-btn.on')?.scrollIntoView({inline:'center',block:'nearest'});}catch(e){}});</script>
</body>
</html>
