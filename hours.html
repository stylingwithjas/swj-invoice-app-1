<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="SWJ Hours">
<meta name="theme-color" content="#1a1814">
<link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="512x512" href="/assets/icon-512.png">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>SWJ — Team Hours</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Cormorant+Garamond:wght@300;400;500;600&display=swap">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
:root{
  --bg:#fcfaf7;--bg-soft:#ffffff;
  --ink:#2c2926;--ink-soft:#3d3833;--muted:#8c847c;--muted-soft:#b8ada1;
  --line:#e7e1d9;--line-soft:#ede8e0;
  --olive:#7a8574;--olive-dark:#5f685a;--olive-tint:#eef1ea;
  --green:#6f8a72;--green-tint:#edf4ee;--green-dark:#4a6b4e;
  --gold:#b89a63;--gold-soft:#f6f1e7;
  --red:#9a5a4a;--red-tint:#f8ece8;
  --cta:#2c2926;
}
body{font-family:'Inter',-apple-system,sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;}
.hdr{background:var(--cta);padding:20px 24px 18px;}
.hdr-inner{max-width:520px;margin:0 auto;}
.brand{font-family:'Cormorant Garamond',serif;font-size:11px;letter-spacing:3px;color:rgba(255,255,255,0.5);text-transform:uppercase;}
.hdr-title{font-family:'Cormorant Garamond',serif;font-size:22px;font-weight:400;color:#f0ebe3;margin-top:3px;}
.content{max-width:520px;margin:0 auto;padding:24px 24px 60px;}
.card{background:var(--bg-soft);border:0.5px solid var(--line);border-radius:14px;padding:20px;margin-top:16px;}
.field{margin-bottom:14px;}
.field:last-child{margin-bottom:0;}
.field-lbl{font-size:10px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:1px;margin-bottom:6px;}
select,input[type=text],input[type=date],input[type=time],input[type=number],input[type=password]{width:100%;font-family:'Inter',sans-serif;font-size:15px;padding:12px 14px;border:0.5px solid var(--line);border-radius:10px;outline:none;background:var(--bg);color:var(--ink);appearance:none;}
select:focus,input:focus{border-color:var(--gold);}
.type-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.type-chip{border:1.5px solid var(--line);border-radius:10px;padding:12px 10px;text-align:center;cursor:pointer;background:var(--bg);transition:all .15s;}
.type-chip.sel{border-color:var(--olive);background:var(--olive-tint);}
.type-name{font-size:13px;font-weight:600;color:var(--ink);}
.type-rate{font-size:11px;color:var(--muted);margin-top:2px;}
.btn{display:block;width:100%;padding:15px;border:none;border-radius:12px;font-size:15px;font-weight:600;cursor:pointer;font-family:'Inter',sans-serif;margin-top:18px;}
.btn-in{background:var(--olive);color:#fff;}
.btn-out{background:var(--red);color:#fff;}
.btn:disabled{opacity:0.5;}
.status-pill{display:inline-block;font-size:10px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;padding:4px 10px;border-radius:20px;background:var(--green-tint);color:var(--green-dark);}
.clocked-name{font-family:'Cormorant Garamond',serif;font-size:24px;margin:10px 0 2px;}
.clocked-sub{font-size:13px;color:var(--muted);}
.since-row{margin-top:16px;padding-top:14px;border-top:0.5px solid var(--line-soft);}
.since-lbl{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.8px;}
.since-val{font-size:14px;font-weight:500;margin-top:2px;}
.recent{margin-top:16px;}
.recent-hdr{font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:1px;margin-bottom:8px;}
.recent-row{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:0.5px solid var(--line-soft);font-size:13px;}
.recent-row:last-child{border-bottom:none;}
.recent-date{color:var(--muted);font-size:11px;}
.recent-amt{font-weight:600;}
.msg{font-size:12px;color:var(--muted);text-align:center;margin-top:10px;min-height:16px;}
.msg.err{color:var(--red);}
.hint{font-size:11px;color:var(--muted-soft);margin-top:8px;line-height:1.5;}
.manual-toggle{font-size:13px;color:var(--olive-dark);cursor:pointer;text-align:center;font-weight:500;}
.manual-seg{margin-bottom:14px;}
.manual-remove{color:var(--red);font-weight:400;text-transform:none;letter-spacing:0;cursor:pointer;font-size:11px;}
.manual-add-row{font-size:12px;color:var(--olive-dark);cursor:pointer;font-weight:500;text-align:center;padding:8px 0;border:1px dashed var(--olive);border-radius:8px;margin-bottom:14px;}
</style>
</head>
<body>

<div class="hdr"><div class="hdr-inner">
  <div class="brand">Styling With Jas</div>
  <div class="hdr-title">Team Hours</div>
</div></div>

<div class="content" id="main-content">
  <div class="card">
    <div class="field">
      <div class="field-lbl">Your Name</div>
      <select id="employee-select" onchange="onEmployeeSelected()">
        <option value="">Select your name…</option>
      </select>
    </div>
    <div class="field" id="password-field-wrap" style="display:none">
      <div class="field-lbl">Password</div>
      <input type="password" id="employee-password" placeholder="Enter your password" onkeydown="if(event.key==='Enter')attemptLogin()">
      <button class="btn btn-in" onclick="attemptLogin()">Log In</button>
      <div class="msg" id="login-msg"></div>
    </div>
  </div>
  <div id="work-area"></div>
</div>

<script>
const _sb = supabase.createClient(
  'https://cwvdfgrjlrpsdfwduwvn.supabase.co',
  'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImN3dmRmZ3JqbHJwc2Rmd2R1d3ZuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzgwMDcyODUsImV4cCI6MjA5MzU4MzI4NX0.zam9AnIwW91TI6eCKUcg05LhvFcRa7op4QsjRpdcrCY'
);

// Rate table Jasmine gave us: on-site staging pays a premium; every other work type
// (destage, warehouse, travel) is the base rate. Snapshotted onto the row at clock-in so a
// future rate change never rewrites already-worked hours.
const WORK_TYPES = [
  { key:'staging',  label:'Staging (On-Site)', rate:35 },
  { key:'destage',  label:'Destage',           rate:25 },
  { key:'warehouse',label:'Warehouse',         rate:25 },
  { key:'travel',   label:'Travel',            rate:25 },
];
const RATE_BY_KEY = Object.fromEntries(WORK_TYPES.map(t=>[t.key,t.rate]));
const LABEL_BY_KEY = Object.fromEntries(WORK_TYPES.map(t=>[t.key,t.label]));

// Non-client work still needs a job to attach hours to, now that Job is required —
// these aren't real invoices, just fixed internal buckets. Add more here if Jasmine
// needs another non-billable category later.
const INTERNAL_JOBS = [
  { invnum:'WAREHOUSE-ORG', label:'Warehouse — Organizing Inventory' },
];

let _selectedType = null;
let _jobs = [];

function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function fmtMoney(n){return '$'+Number(n||0).toFixed(2);}
function sumTotals(entries){
  const hours = entries.reduce((s,e)=>s+(parseFloat(e.hours)||0),0);
  const amount = entries.reduce((s,e)=>s+(parseFloat(e.amount)||0),0);
  return { hours: Math.round(hours*100)/100, amount: Math.round(amount*100)/100 };
}
function fmtTime(iso){ return new Date(iso).toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'}); }
function findJobLabel(invnum){
  if(!invnum) return null;
  const internal = INTERNAL_JOBS.find(j=>j.invnum===invnum);
  if(internal) return internal.label;
  const job = _jobs.find(j=>j.invnum===invnum);
  return job ? jobLabel(job) : null;
}

// Employee passwords are stored as a SHA-256 hash (never the raw password) — set/reset by
// Jasmine on payroll.html, checked here at login the same way.
async function sha256Hex(str){
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str));
  return [...new Uint8Array(buf)].map(b=>b.toString(16).padStart(2,'0')).join('');
}

let _employeesCache = [];

async function loadEmployees(){
  const sel = document.getElementById('employee-select');
  try{
    const {data,error} = await _sb.from('employees').select('name,password_hash').eq('active',true).order('name');
    if(error) throw error;
    _employeesCache = data||[];
    _employeesCache.forEach(e=>{
      const opt = document.createElement('option');
      opt.value = e.name; opt.textContent = e.name;
      sel.appendChild(opt);
    });
    const remembered = localStorage.getItem('swj_hours_employee');
    if(remembered && _employeesCache.some(e=>e.name===remembered)){
      sel.value = remembered;
      onEmployeeSelected();
    }
  }catch(e){
    document.getElementById('work-area').innerHTML = `<div class="card"><div class="msg err">Could not load the team list. Please contact Jasmine.</div></div>`;
  }
}

// Picking a name only reveals the password box — it does NOT log in automatically, even
// if this name was remembered from last time, so a shared/left-open device can't be used
// to clock in as someone else without their password.
function onEmployeeSelected(){
  const pwWrap = document.getElementById('password-field-wrap');
  const pwInput = document.getElementById('employee-password');
  const msg = document.getElementById('login-msg');
  document.getElementById('work-area').innerHTML = '';
  msg.textContent = ''; msg.classList.remove('err');
  pwInput.value = '';
  const name = document.getElementById('employee-select').value;
  if(!name){ pwWrap.style.display = 'none'; return; }
  pwWrap.style.display = 'block';
  pwInput.focus();
}

async function attemptLogin(){
  const name = document.getElementById('employee-select').value;
  const pwInput = document.getElementById('employee-password');
  const msg = document.getElementById('login-msg');
  msg.classList.remove('err');
  if(!name) return;
  const emp = _employeesCache.find(e=>e.name===name);
  if(!emp || !emp.password_hash){
    msg.textContent = 'No password set for this account yet — ask Jasmine to set one in Payroll.';
    msg.classList.add('err');
    return;
  }
  msg.textContent = 'Checking…';
  const hash = await sha256Hex(pwInput.value);
  if(hash !== emp.password_hash){
    msg.textContent = 'Incorrect password.';
    msg.classList.add('err');
    pwInput.value = '';
    pwInput.focus();
    return;
  }
  msg.textContent = '';
  localStorage.setItem('swj_hours_employee', name);
  document.getElementById('password-field-wrap').style.display = 'none';
  onEmployeeChange();
}

const STAGE_LABEL = { proposal:'Proposal', confirmed:'Confirmed', staged:'Staged', destage:'Destage', done:'Done' };

// Pulls the same active board list Jasmine sees on board.html (excludes drafts, the
// separate GS Photography business, and denied jobs) so employees pick from real,
// currently-relevant projects instead of every invoice ever created.
async function loadJobs(){
  try{
    const {data} = await _sb.from('invoices').select('invnum,client,address,invdate,data')
      .not('invnum','like','DRAFT-%').not('invnum','like','GS%')
      .order('invdate',{ascending:false}).limit(50);
    _jobs = (data||[]).filter(j => ((j.data||{}).stage||'proposal') !== 'denied');
  }catch(e){ _jobs = []; }
}
function jobLabel(j){
  const stage = STAGE_LABEL[(j.data||{}).stage||'proposal'] || '';
  return `${j.client||'Client'} — ${j.address||''}${stage?' ('+stage+')':''}`;
}

async function onEmployeeChange(){
  const name = document.getElementById('employee-select').value;
  if(!name){ document.getElementById('work-area').innerHTML=''; return; }
  localStorage.setItem('swj_hours_employee', name);
  document.getElementById('work-area').innerHTML = `<div class="card"><div class="msg">Loading…</div></div>`;
  await loadJobs();

  // "Still on the clock" means a live clock-in with no hours computed yet — checking
  // hours (not just clock_out) keeps manual entries (which never have a clock_out but
  // DO have hours filled in immediately) from being mistaken for an active shift.
  const {data,error} = await _sb.from('time_entries').select('*')
    .eq('employee_name', name).is('clock_out', null).is('hours', null)
    .order('clock_in',{ascending:false}).limit(1);

  if(!error && data && data[0]){
    renderClockedIn(name, data[0]);
  } else {
    renderClockIn(name);
  }
  await renderTodayTimeline(name);
  renderRecent(name);
}

// Shows every segment worked today as one continuous shift (e.g. Travel 10:50-11:30am,
// Staging 11:30am-1pm, Travel 1-1:30pm) instead of a single clock-in/out block — only
// appears once there's more than one segment today, since the "Clocked In" card above
// already covers the single-segment case.
async function renderTodayTimeline(name){
  const startOfDay = new Date(); startOfDay.setHours(0,0,0,0);
  const {data} = await _sb.from('time_entries').select('*')
    .eq('employee_name', name).gte('clock_in', startOfDay.toISOString())
    .order('clock_in', {ascending:true});
  if(!data || data.length < 2) return;
  const rows = data.map(e=>{
    const range = e.clock_out ? `${fmtTime(e.clock_in)} – ${fmtTime(e.clock_out)}` : `${fmtTime(e.clock_in)} – ongoing`;
    return `<div class="recent-row">
      <div>
        <div>${esc(LABEL_BY_KEY[e.work_type]||e.work_type)}</div>
        <div class="recent-date">${range}${e.job_label?' · '+esc(e.job_label):''}</div>
      </div>
      <div class="recent-amt">${e.hours!=null?e.hours+'h':''}</div>
    </div>`;
  }).join('');
  const {hours, amount} = sumTotals(data);
  document.getElementById('work-area').insertAdjacentHTML('beforeend', `
    <div class="card recent">
      <div class="recent-hdr">Today's Activity</div>
      ${rows}
      <div class="recent-row" style="border-top:1.5px solid var(--line);margin-top:2px;padding-top:12px;font-weight:700">
        <div>Total So Far</div>
        <div class="recent-amt">${hours}h · ${fmtMoney(amount)}</div>
      </div>
    </div>
  `);
}

function jobOptionsHtml(selected){
  const internalOpts = INTERNAL_JOBS.map(j=>`<option value="${esc(j.invnum)}" ${j.invnum===selected?'selected':''}>${esc(j.label)}</option>`).join('');
  const jobOpts = _jobs.map(j=>`<option value="${esc(j.invnum)}" ${j.invnum===selected?'selected':''}>${esc(jobLabel(j))}</option>`).join('');
  const placeholder = `<option value="" disabled ${selected?'':'selected'}>Select a job…</option>`;
  return placeholder + internalOpts + jobOpts;
}

function renderClockIn(name){
  _selectedType = null;
  document.getElementById('work-area').innerHTML = `
    <div class="card">
      <div class="field">
        <div class="field-lbl">Type of Work</div>
        <div class="type-grid" id="type-grid">
          ${WORK_TYPES.map(t=>`<div class="type-chip" id="chip-${t.key}" onclick="selectType('${t.key}')">
            <div class="type-name">${esc(t.label)}</div>
            <div class="type-rate">$${t.rate}/hr</div>
          </div>`).join('')}
        </div>
      </div>
      <div class="field">
        <div class="field-lbl">Job</div>
        <select id="job-select" onchange="updateClockInBtn()">
          ${jobOptionsHtml(null)}
        </select>
      </div>
      <button class="btn btn-in" id="clockin-btn" onclick="clockIn('${esc(name)}')" disabled>Select a work type and job to clock in</button>
      <div class="msg" id="clockin-msg"></div>
    </div>
    <div class="card">
      <div class="manual-toggle" id="manual-toggle" onclick="showManualForm('${esc(name)}')">Forgot to clock in or out? Log hours manually →</div>
      <div id="manual-form-wrap"></div>
    </div>
  `;
}

function updateClockInBtn(){
  const btn = document.getElementById('clockin-btn');
  if(!btn) return;
  const jobVal = document.getElementById('job-select')?.value;
  const ready = _selectedType && jobVal;
  btn.disabled = !ready;
  btn.textContent = ready ? `Clock In — ${LABEL_BY_KEY[_selectedType]}` : (
    !_selectedType ? 'Select a work type and job to clock in' : 'Select a job to clock in'
  );
}

// Manual logging models the same "checkpoints" a real shift has: a clock-in time+type,
// zero or more switch times+types, and a final clock-out time. e.g. "10am Warehouse, 2pm
// On-Site, 8pm Clock Out" becomes two segments (Warehouse 10am-2pm, On-Site 2pm-8pm) —
// matching exactly how the live clock in/switch/out flow records real shifts, instead of
// a single flattened "hours worked" number with no breakdown.
let _manualSegments = [];
let _manualClockOutTime = '';

function showManualForm(name){
  document.getElementById('manual-toggle').style.display = 'none';
  _manualSegments = [{ time:'', type:'', invnum:'' }];
  _manualClockOutTime = '';
  renderManualForm(name);
}

function syncManualSegmentsFromDom(){
  document.querySelectorAll('.manual-seg').forEach((row, idx)=>{
    if(!_manualSegments[idx]) return;
    _manualSegments[idx].time = row.querySelector('.ms-time').value;
    _manualSegments[idx].type = row.querySelector('.ms-type').value;
    _manualSegments[idx].invnum = row.querySelector('.ms-job').value;
  });
  const coEl = document.getElementById('manual-clockout-time');
  if(coEl) _manualClockOutTime = coEl.value;
}

function addManualSegment(name){
  syncManualSegmentsFromDom();
  _manualSegments.push({ time:'', type:'', invnum:'' });
  renderManualForm(name);
}

function removeManualSegment(name, idx){
  syncManualSegmentsFromDom();
  _manualSegments.splice(idx, 1);
  renderManualForm(name);
}

function renderManualForm(name){
  const today = new Date().toISOString().split('T')[0];
  const dateVal = document.getElementById('manual-date')?.value || today;
  const typeOptions = seg => `<option value="">Type…</option>` + WORK_TYPES.map(t=>
    `<option value="${t.key}" ${seg.type===t.key?'selected':''}>${esc(t.label)} ($${t.rate}/hr)</option>`
  ).join('');

  const segRows = _manualSegments.map((seg, idx)=>`
    <div class="manual-seg">
      <div class="field-lbl">${idx===0?'Clock In':'Switch To'}${_manualSegments.length>1 && idx>0?` <span class="manual-remove" onclick="removeManualSegment('${esc(name)}',${idx})">Remove</span>`:''}</div>
      <div style="display:flex;gap:8px">
        <input type="time" class="ms-time" value="${esc(seg.time)}" style="flex:1">
        <select class="ms-type" style="flex:1.4">${typeOptions(seg)}</select>
      </div>
      <select class="ms-job" style="margin-top:6px">${jobOptionsHtml(seg.invnum)}</select>
    </div>
  `).join('');

  document.getElementById('manual-form-wrap').innerHTML = `
    <div class="field" style="margin-top:14px">
      <div class="field-lbl">Date</div>
      <input type="date" id="manual-date" value="${dateVal}" max="${today}">
    </div>
    ${segRows}
    <div class="manual-add-row" onclick="addManualSegment('${esc(name)}')">+ Add Another Activity (Switch)</div>
    <div class="manual-clockout-row" style="border-top:1px dashed var(--line);padding-top:12px;margin-top:12px;margin-bottom:14px">
      <div class="field-lbl">Clock Out Time (end of shift)</div>
      <input type="time" id="manual-clockout-time" value="${esc(_manualClockOutTime)}">
    </div>
    <div class="field">
      <div class="field-lbl">Note (optional)</div>
      <input type="text" id="manual-note" placeholder="e.g. Forgot to clock in/out">
    </div>
    <button class="btn btn-in" id="manual-submit-btn" onclick="submitManual('${esc(name)}')">Log Hours</button>
    <div class="msg" id="manual-msg"></div>
  `;
}

async function submitManual(name){
  syncManualSegmentsFromDom();
  const msg = document.getElementById('manual-msg');
  const dateVal = document.getElementById('manual-date').value;
  const note = document.getElementById('manual-note').value.trim() || null;

  if(!dateVal){ msg.textContent = 'Pick a date.'; msg.classList.add('err'); return; }
  for(const seg of _manualSegments){
    if(!seg.time || !seg.type || !seg.invnum){
      msg.textContent = 'Fill in the time, type, and job for every activity.'; msg.classList.add('err'); return;
    }
  }
  if(!_manualClockOutTime){ msg.textContent = 'Enter the clock-out time for the end of the shift.'; msg.classList.add('err'); return; }

  // Build one row per segment: this checkpoint's time -> the next checkpoint's time (or
  // the final clock-out time for the last one). Times must be strictly increasing.
  const checkpoints = [..._manualSegments.map(s=>s.time), _manualClockOutTime];
  for(let i=1;i<checkpoints.length;i++){
    if(checkpoints[i] <= checkpoints[i-1]){
      msg.textContent = 'Each time must be later than the one before it.'; msg.classList.add('err'); return;
    }
  }

  const btn = document.getElementById('manual-submit-btn');
  btn.disabled = true; btn.textContent = 'Logging…';

  const rows = _manualSegments.map((seg, i)=>{
    const startIso = `${dateVal}T${seg.time}:00`;
    const endIso = `${dateVal}T${checkpoints[i+1]}:00`;
    const hours = Math.round(((new Date(endIso) - new Date(startIso)) / 3600000) * 100) / 100;
    const rate = RATE_BY_KEY[seg.type];
    const amount = Math.round(hours * rate * 100) / 100;
    return {
      employee_name: name,
      work_type: seg.type,
      rate, invnum: seg.invnum, job_label: findJobLabel(seg.invnum), note,
      source: 'manual',
      clock_in: startIso,
      clock_out: endIso,
      hours, amount,
    };
  });

  try{
    const {error} = await _sb.from('time_entries').insert(rows);
    if(error) throw error;
    onEmployeeChange();
  }catch(e){
    msg.textContent = 'Error: '+e.message; msg.classList.add('err');
    btn.disabled = false; btn.textContent = 'Log Hours';
  }
}

function selectType(key){
  _selectedType = key;
  WORK_TYPES.forEach(t=>document.getElementById('chip-'+t.key).classList.toggle('sel', t.key===key));
  updateClockInBtn();
}

async function clockIn(name){
  const jobSel = document.getElementById('job-select');
  const invnum = jobSel.value || null;
  if(!_selectedType || !invnum) return;
  const btn = document.getElementById('clockin-btn');
  const msg = document.getElementById('clockin-msg');
  btn.disabled = true; btn.textContent = 'Clocking in…';
  const job_label = findJobLabel(invnum);

  try{
    const {error} = await _sb.from('time_entries').insert({
      employee_name: name,
      work_type: _selectedType,
      rate: RATE_BY_KEY[_selectedType],
      invnum, job_label,
      source: 'clock',
      clock_in: new Date().toISOString(),
    });
    if(error) throw error;
    onEmployeeChange();
  }catch(e){
    msg.textContent = 'Error: '+e.message; msg.classList.add('err');
    btn.disabled = false; updateClockInBtn();
  }
}

function elapsedStr(startIso){
  const ms = Date.now() - new Date(startIso).getTime();
  const h = Math.floor(ms/3600000), m = Math.floor((ms%3600000)/60000);
  return `${h}h ${m}m`;
}

let _tickTimer = null;
function renderClockedIn(name, entry){
  clearInterval(_tickTimer);
  document.getElementById('work-area').innerHTML = `
    <div class="card">
      <span class="status-pill">Clocked In</span>
      <div class="clocked-name">${esc(name)}</div>
      <div class="clocked-sub">${esc(LABEL_BY_KEY[entry.work_type]||entry.work_type)} · $${entry.rate}/hr${entry.job_label?' · '+esc(entry.job_label):''}</div>
      <div class="since-row">
        <div class="since-lbl">Since ${fmtTime(entry.clock_in)}</div>
        <div class="since-val" id="elapsed-val">${elapsedStr(entry.clock_in)} on this activity</div>
      </div>
      <button class="btn btn-in" id="switch-btn" onclick="showSwitchForm('${entry.id}','${esc(name)}')">Switch Activity</button>
      <button class="btn btn-out" id="clockout-btn" onclick="clockOut('${entry.id}','${esc(name)}')">Clock Out — End Shift</button>
      <div class="msg" id="clockout-msg"></div>
      <div id="switch-form-wrap"></div>
    </div>
  `;
  _tickTimer = setInterval(()=>{
    const el = document.getElementById('elapsed-val');
    if(el) el.textContent = elapsedStr(entry.clock_in)+' on this activity';
  }, 30000);
}

// Switching activity closes the current segment (clock_out = now) and immediately opens a
// new one with the new type/job at the same instant — one continuous shift made of multiple
// timed blocks, instead of forcing a full clock-out/clock-in for every change of activity.
let _switchType = null;
function showSwitchForm(entryId, name){
  document.getElementById('switch-btn').style.display = 'none';
  document.getElementById('clockout-btn').style.display = 'none';
  _switchType = null;
  document.getElementById('switch-form-wrap').innerHTML = `
    <div class="field" style="margin-top:14px">
      <div class="field-lbl">Switching To</div>
      <div class="type-grid" id="switch-type-grid">
        ${WORK_TYPES.map(t=>`<div class="type-chip" id="schip-${t.key}" onclick="selectSwitchType('${t.key}')">
          <div class="type-name">${esc(t.label)}</div>
          <div class="type-rate">$${t.rate}/hr</div>
        </div>`).join('')}
      </div>
    </div>
    <div class="field">
      <div class="field-lbl">Job</div>
      <select id="switch-job-select" onchange="updateSwitchBtn()">
        ${jobOptionsHtml(null)}
      </select>
    </div>
    <button class="btn btn-in" id="switch-confirm-btn" onclick="switchActivity('${entryId}','${esc(name)}')" disabled>Select a work type and job to switch</button>
    <button class="btn" style="background:var(--line-soft);color:var(--ink-soft);margin-top:8px" onclick="onEmployeeChange()">Cancel</button>
    <div class="msg" id="switch-msg"></div>
  `;
}
function selectSwitchType(key){
  _switchType = key;
  WORK_TYPES.forEach(t=>document.getElementById('schip-'+t.key).classList.toggle('sel', t.key===key));
  updateSwitchBtn();
}
function updateSwitchBtn(){
  const btn = document.getElementById('switch-confirm-btn');
  if(!btn) return;
  const jobVal = document.getElementById('switch-job-select')?.value;
  const ready = _switchType && jobVal;
  btn.disabled = !ready;
  btn.textContent = ready ? `Switch to ${LABEL_BY_KEY[_switchType]}` : 'Select a work type and job to switch';
}
async function switchActivity(entryId, name){
  const jobSel = document.getElementById('switch-job-select');
  const invnum = jobSel.value || null;
  if(!_switchType || !invnum) return;
  const btn = document.getElementById('switch-confirm-btn');
  const msg = document.getElementById('switch-msg');
  btn.disabled = true; btn.textContent = 'Switching…';
  try{
    const {data,error} = await _sb.from('time_entries').select('*').eq('id', entryId).limit(1);
    if(error || !data || !data[0]) throw new Error('Entry not found');
    const entry = data[0];
    const nowIso = new Date().toISOString();
    const hours = Math.round(((new Date(nowIso) - new Date(entry.clock_in)) / 3600000) * 100) / 100;
    const amount = Math.round(hours * entry.rate * 100) / 100;
    const {error:closeErr} = await _sb.from('time_entries').update({clock_out: nowIso, hours, amount}).eq('id', entryId);
    if(closeErr) throw closeErr;
    const job_label = findJobLabel(invnum);
    const {error:openErr} = await _sb.from('time_entries').insert({
      employee_name: name, work_type: _switchType, rate: RATE_BY_KEY[_switchType],
      invnum, job_label, source:'clock', clock_in: nowIso,
    });
    if(openErr) throw openErr;
    onEmployeeChange();
  }catch(e){
    msg.textContent = 'Error: '+e.message; msg.classList.add('err');
    btn.disabled = false; updateSwitchBtn();
  }
}

async function clockOut(id, name){
  const btn = document.getElementById('clockout-btn');
  const msg = document.getElementById('clockout-msg');
  btn.disabled = true; btn.textContent = 'Clocking out…';
  try{
    const {data,error} = await _sb.from('time_entries').select('*').eq('id', id).limit(1);
    if(error || !data || !data[0]) throw new Error('Entry not found');
    const entry = data[0];
    const clockOutIso = new Date().toISOString();
    const hours = Math.round(((new Date(clockOutIso) - new Date(entry.clock_in)) / 3600000) * 100) / 100;
    const amount = Math.round(hours * entry.rate * 100) / 100;
    const {error:updErr} = await _sb.from('time_entries').update({
      clock_out: clockOutIso, hours, amount,
    }).eq('id', id);
    if(updErr) throw updErr;
    clearInterval(_tickTimer);
    await showShiftEndSummary(name);
  }catch(e){
    msg.textContent = 'Error: '+e.message; msg.classList.add('err');
    btn.disabled = false; btn.textContent = 'Clock Out';
  }
}

// A clear, unmistakable "your shift just ended" screen — shows every block worked today
// plus the day's total hours AND total payout, so there's no ambiguity that clocking out
// closed the whole shift (not just the current activity).
async function showShiftEndSummary(name){
  const startOfDay = new Date(); startOfDay.setHours(0,0,0,0);
  const {data} = await _sb.from('time_entries').select('*')
    .eq('employee_name', name).gte('clock_in', startOfDay.toISOString()).not('amount','is',null)
    .order('clock_in',{ascending:true});
  const entries = data || [];
  const {hours, amount} = sumTotals(entries);
  const rows = entries.map(e=>{
    const range = e.clock_out ? `${fmtTime(e.clock_in)} – ${fmtTime(e.clock_out)}` : '';
    return `<div class="recent-row">
      <div>
        <div>${esc(LABEL_BY_KEY[e.work_type]||e.work_type)}</div>
        <div class="recent-date">${range}${e.job_label?' · '+esc(e.job_label):''}</div>
      </div>
      <div class="recent-amt">${e.hours}h · ${fmtMoney(e.amount)}</div>
    </div>`;
  }).join('');
  document.getElementById('work-area').innerHTML = `
    <div class="card">
      <span class="status-pill" style="background:var(--red-tint);color:var(--red)">Shift Ended</span>
      <div class="clocked-name">${esc(name)}</div>
      <div class="clocked-sub">Your shift is fully clocked out.</div>
      <div class="since-row">
        <div class="since-lbl">Today's Total</div>
        <div class="since-val" style="font-size:22px;font-family:'Cormorant Garamond',serif">${hours}h &nbsp;·&nbsp; ${fmtMoney(amount)}</div>
      </div>
      <button class="btn btn-in" onclick="onEmployeeChange()">Start a New Shift</button>
    </div>
    <div class="card recent">
      <div class="recent-hdr">Today's Activity</div>
      ${rows}
      <div class="recent-row" style="border-top:1.5px solid var(--line);margin-top:2px;padding-top:12px;font-weight:700">
        <div>Total</div>
        <div class="recent-amt">${hours}h · ${fmtMoney(amount)}</div>
      </div>
    </div>
  `;
  notifyJasmineShiftEnded(name, entries, hours, amount);
}

// Fire-and-forget notification so Jasmine can approve straight from her inbox — a second
// route into the same approval, alongside the Approve button on payroll.html. The link
// points at approve-hours.html (no login needed, same low-friction pattern as the
// signature/confirm links) with every entry id from today's shift.
function notifyJasmineShiftEnded(name, entries, hours, amount){
  if(!entries.length) return;
  const dateStr = new Date(entries[0].clock_in).toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric'});
  const lines = entries.map(e=>{
    const range = e.clock_out ? `${fmtTime(e.clock_in)}–${fmtTime(e.clock_out)}` : '';
    return `- ${LABEL_BY_KEY[e.work_type]||e.work_type} ${range}${e.job_label?' · '+e.job_label:''} · ${e.hours}h · ${fmtMoney(e.amount)}`;
  }).join('\n');
  const ids = entries.map(e=>e.id).join(',');
  const approveLink = location.origin + '/approve-hours.html?ids=' + encodeURIComponent(ids);
  const message = `${name} just clocked out for ${dateStr}.\n\nActivity breakdown:\n${lines}\n\nTotal: ${hours}h · ${fmtMoney(amount)}\n\nApprove these hours:\n${approveLink}`;
  fetch('/api/email', {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({
      to: 'info@stylingwithjas.com',
      subject: `Shift ended — ${name} — ${hours}h · ${fmtMoney(amount)}`,
      message,
    })
  }).catch(()=>{});
}

async function renderRecent(name){
  const {data} = await _sb.from('time_entries').select('*')
    .eq('employee_name', name).not('amount','is',null)
    .order('clock_in',{ascending:false}).limit(6);
  if(!data || !data.length) return;
  const rows = data.map(e=>{
    const d = new Date(e.clock_in);
    const dateStr = d.toLocaleDateString('en-US',{month:'short',day:'numeric'});
    const approvalTag = e.approved
      ? `<span style="color:var(--green-dark)">✓ Approved by Jasmine</span>`
      : `<span style="color:var(--muted-soft)">Pending approval</span>`;
    return `<div class="recent-row">
      <div>
        <div>${esc(LABEL_BY_KEY[e.work_type]||e.work_type)}</div>
        <div class="recent-date">${dateStr}${e.job_label?' · '+esc(e.job_label):''}</div>
        <div class="recent-date">${approvalTag}</div>
      </div>
      <div class="recent-amt">${e.hours}h · ${fmtMoney(e.amount)}</div>
    </div>`;
  }).join('');
  document.getElementById('work-area').insertAdjacentHTML('beforeend', `
    <div class="card recent">
      <div class="recent-hdr">Recent Entries</div>
      ${rows}
    </div>
  `);
}

document.addEventListener('DOMContentLoaded', loadEmployees);
</script>
